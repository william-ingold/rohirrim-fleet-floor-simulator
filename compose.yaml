services:
  api:
    build:
      context: .
      target: api
    init: true
    volumes:
      - fleet-data:/data
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    restart: unless-stopped
    stop_grace_period: 20s

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fleet-data:
